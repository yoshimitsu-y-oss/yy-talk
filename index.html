  <script>
    // --- 🚨 UI Debug Logger ---
    function uiLog(msg, color='#4ade80') {
      const d = document.getElementById('debug-logger'); if(!d) return;
      const l = document.createElement('div'); l.style.color = color;
      l.textContent = `[${new Date().toISOString().split('T')[1].slice(0,-1)}] ${msg}`;
      d.appendChild(l); d.scrollTop = d.scrollHeight;
    }
    window.onerror = function(msg, src, line, col, err) { uiLog(`ERROR: ${msg} (${line}:${col})`, '#ef4444'); return false; };
    window.onunhandledrejection = function(e) { uiLog(`PROMISE ERR: ${e.reason}`, '#ef4444'); };
    
    // --- Safe Resize ---
    window.forceResize = function() {
      const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.height = h + 'px'; document.body.style.height = h + 'px';
      const c = document.getElementById('main-app-container'); if (c) c.style.height = h + 'px';
      window.scrollTo(0, 0);
    };
    window.addEventListener('resize', window.forceResize);
    window.addEventListener('orientationchange', () => { setTimeout(window.forceResize, 50); setTimeout(window.forceResize, 200); setTimeout(window.forceResize, 500); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', window.forceResize);

    try {
      if (typeof navigator !== 'undefined' && navigator.mediaDevices) {
        let originalGUM = navigator.mediaDevices.getUserMedia;
        if (originalGUM) {
          originalGUM = originalGUM.bind(navigator.mediaDevices);
          Object.defineProperty(navigator.mediaDevices, 'getUserMedia', {
            get: () => originalGUM, set: (val) => { originalGUM = val; }, configurable: true, enumerable: true
          });
        }
      }
    } catch (e) { }

    const origSetLocalDescription = RTCPeerConnection.prototype.setLocalDescription;
    RTCPeerConnection.prototype.setLocalDescription = function(desc) {
      if (desc && (desc.type === 'offer' || desc.type === 'answer')) desc.sdp = desc.sdp.replace(/(a=fmtp:111.*)/g, '$1;usedtx=1');
      return origSetLocalDescription.apply(this, arguments);
    };
  </script>
